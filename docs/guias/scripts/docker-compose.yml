services:
  jwbot:
    image: ghcr.io/wagchi22/jwbot:latest
    container_name: jwbot
    init: true
    restart: unless-stopped
    environment:
      DOTENV_CONFIG_PATH: /app/.wwebjs_auth/.env
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_NO_SANDBOX: "1"
    command: ["node", "-r", "dotenv/config", "src/index.js"]
    ports:
      - "3000:3000"
    volumes:
      - jwbot:/app/.wwebjs_auth

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent:/config
      - ./data:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - prowlarr:/config
    ports:
      - 9696:9696
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - sonarr:/config
      - ./data:/data
    ports:
      - 8989:8989
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - radarr:/config
      - ./data:/data
    ports:
      - 7878:7878
    restart: always

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - jellyfin:/config
      - ./data:/data
    ports:
      - 8096:8096
    restart: always

volumes:
  jwbot:
    name: jwbot
  qbittorrent:
    name: qbittorrent
  prowlarr:
    name: prowlarr
  sonarr:
    name: sonarr
  radarr:
    name: radarr
  jellyfin:
    name: jellyfin
